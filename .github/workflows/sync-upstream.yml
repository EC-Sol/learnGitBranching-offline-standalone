name: Sync from upstream

# Pull the latest commits from pcottle/learnGitBranching into the
# main branch. A successful push triggers the release workflow.
on:
  schedule:
    # Weekly, Monday 09:00 KST (Monday 00:00 UTC).
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/pcottle/learnGitBranching.git
          git fetch upstream main

      - name: Check for new upstream commits
        id: upstream
        run: |
          new_commits=$(git rev-list --count HEAD..upstream/main)
          echo "new_commits=${new_commits}" >> "$GITHUB_OUTPUT"
          echo "Upstream has ${new_commits} new commit(s)."

      - name: Rebase upstream/main
        if: steps.upstream.outputs.new_commits != '0'
        run: git rebase upstream/main

      - name: Push rebased result
        if: steps.upstream.outputs.new_commits != '0'
        run: git push --force-with-lease origin main

      - name: Report merge failure
        if: failure() && steps.upstream.outputs.new_commits != '0'
        run: |
          echo "::error::Rebase to upstream/main has conflicts on main."
          echo "::error::Resolve manually: git fetch upstream main && git rebase upstream/main, then push."
          exit 1
